<!doctype html>
<title>喵喵領地</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1733">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&display=swap">
<style>
  /* 版面：單欄 App（最寬 520px）置中；夜晚屋頂主題。首頁選模式 → 全螢幕遊戲 → 暫停叫出設定 */
  :root{
    --night:#1b1733; --night-hi:#2b2350; --card:#2a2350; --card-hi:#372e66;
    --ink:#fff6ea; --ink-dim:#bfb3dd; --frame:#241c3f;
    --peach:#ffa47e; --peach-d:#d0704d; --mint:#86dfc6; --mint-d:#4ea88f;
    --butter:#ffd76e; --butter-d:#cf9f35; --lav:#bba8ff; --lav-d:#8670d6; --rose:#ff7d8e;
    --btn-ink:#2b1e16; --glass:rgba(255,255,255,.08); --glass-line:rgba(255,255,255,.13);
    --font:"Huninn","Fredoka","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    --num:"Fredoka","Huninn",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;touch-action:manipulation;-webkit-touch-callout:none}
  html{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--night)}
  body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--font);
    overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  button:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:3px}
  [hidden]{display:none!important}

  /* ---------- 夜空背景 ---------- */
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(120% 60% at 50% 110%, #4a3a78 0%, transparent 60%),
      linear-gradient(180deg,#120e26 0%,#1b1733 45%,#2b2350 100%)}
  .sky::before{content:"";position:absolute;inset:0;opacity:.75;
    background-image:
      radial-gradient(1.4px 1.4px at 20px 30px,#fff 50%,transparent 51%),
      radial-gradient(1px 1px at 90px 80px,#fff 50%,transparent 51%),
      radial-gradient(1.6px 1.6px at 150px 20px,#ffe9b8 50%,transparent 51%),
      radial-gradient(1px 1px at 60px 140px,#fff 50%,transparent 51%),
      radial-gradient(1.2px 1.2px at 170px 120px,#fff 50%,transparent 51%);
    background-size:200px 170px;animation:twinkle 6s ease-in-out infinite alternate}
  .moon{position:fixed;top:max(28px,env(safe-area-inset-top,0px));right:max(26px,env(safe-area-inset-right,0px));width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff8df,#ffe3a1 60%,#f3c873);
    box-shadow:0 0 40px 10px rgba(255,220,140,.25),0 0 120px 40px rgba(255,220,140,.08);z-index:0;pointer-events:none}
  .moon::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(214,170,90,.35);top:36px;left:18px;box-shadow:16px -14px 0 -3px rgba(214,170,90,.3)}
  @keyframes twinkle{from{opacity:.45}to{opacity:.85}}

  /* ---------- 共用：畫面容器 ---------- */
  .screen{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px))}

  /* ---------- 立體按鈕 ---------- */
  .b3d{--c:var(--peach);--d:var(--peach-d);position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
    border-radius:20px;background:var(--c);color:var(--btn-ink);font-size:20px;padding:16px 22px;overflow:hidden;
    box-shadow:0 6px 0 var(--d),0 14px 22px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5);
    transition:transform .08s ease,box-shadow .08s ease}
  .b3d::before{content:"";position:absolute;left:8px;right:8px;top:4px;height:42%;border-radius:16px 16px 40% 40%;
    background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}
  .b3d:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d),0 4px 8px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.5)}
  .b3d.mint{--c:var(--mint);--d:var(--mint-d)} .b3d.lav{--c:var(--lav);--d:var(--lav-d)} .b3d.butter{--c:var(--butter);--d:var(--butter-d)}
  .b3d.ghost{--c:#40366f;--d:#2a2350;color:var(--ink)}
  .b3d.ghost::before{opacity:.25}
  .b3d .ic{width:24px;height:24px}
  .chip{font-family:var(--num);font-size:14px;font-weight:600;background:rgba(43,30,22,.14);padding:3px 10px;border-radius:99px}

  /* 圓形小圖示按鈕 */
  .ibtn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--glass);
    border:1px solid var(--glass-line);color:var(--ink);transition:transform .1s,background .15s;flex:none;position:relative}
  .ibtn:active{transform:scale(.9)}
  @media (hover:hover){.ibtn:hover{background:rgba(255,255,255,.14)}}
  .ibtn .ic{width:22px;height:22px}
  .ibtn.off{color:var(--ink-dim);opacity:.6}
  .ic{display:block}

  /* ---------- 首頁 ---------- */
  #home{overflow-y:auto;overflow-x:hidden;justify-content:center;gap:14px}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:8px}
  .logo{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 40%,#4b3e86,#2a2350 70%);box-shadow:0 0 0 6px rgba(255,255,255,.05),0 0 60px rgba(187,168,255,.35);
    animation:bob 3.2s ease-in-out infinite}
  .logo svg{width:84px;height:84px}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .hero h1{margin:6px 0 0;font-size:46px;font-weight:400;letter-spacing:.12em;text-indent:.12em;
    text-shadow:0 3px 0 #120e26,0 0 24px rgba(255,215,110,.35)}
  .hero p{margin:0;color:var(--ink-dim);font-size:15px;letter-spacing:.06em}
  .tile{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:20px;
    background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--glass-line);
    box-shadow:0 5px 0 #1a1533,0 12px 20px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
  .tile:active{transform:translateY(4px);box-shadow:0 1px 0 #1a1533,0 4px 8px rgba(0,0,0,.3)}
  .tile .bub{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none;color:var(--btn-ink);background:var(--c);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.45)}
  .tile .bub .ic{width:26px;height:26px}
  .tile .txt{flex:1;min-width:0}
  .tile .t1{font-size:19px} .tile .t2{font-size:13px;color:var(--ink-dim);margin-top:2px}
  .tile .chev{color:var(--ink-dim)} .tile .chev .ic{width:20px;height:20px}
  .done-badge{font-size:12px;color:var(--btn-ink);background:var(--mint);padding:3px 9px;border-radius:99px;flex:none}
  .homebar{display:flex;justify-content:center;gap:26px;margin-top:6px}
  .hb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink-dim)}
  .roofs{position:fixed;left:0;right:0;bottom:0;height:90px;z-index:0;pointer-events:none;opacity:.9}

  /* ---------- 遊戲畫面 ---------- */
  #game{gap:8px}
  .gtop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
  .gtitle{text-align:center;line-height:1.15}
  .gtitle .lv{font-size:15px;color:var(--ink-dim)}
  .gtitle .tm{font-family:var(--num);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .gright{display:flex;gap:8px}
  .hearts{display:flex;justify-content:center;gap:8px;height:28px}
  .hearts svg{width:28px;height:28px;fill:var(--rose);filter:drop-shadow(0 3px 0 #a83c4d);transition:transform .2s}
  .hearts svg.lost{fill:#3f3766;filter:none;transform:scale(.85)}
  .hearts svg.break{animation:breakH .5s}
  @keyframes breakH{0%{transform:scale(1.3)}40%{transform:scale(.7) rotate(-12deg)}100%{transform:scale(.85)}}
  .boardArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  .board{display:grid;border:5px solid var(--frame);border-radius:16px;overflow:hidden;background:var(--frame);touch-action:none;
    box-shadow:0 0 0 2px rgba(255,255,255,.08),0 22px 44px rgba(0,0,0,.5)}
  .cell{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;border-style:solid;border-width:0}
  .cell::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);pointer-events:none}
  @media (hover:hover){ .cell:hover::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.3)} }
  .cell .xm{width:38%;height:38%;stroke:rgba(36,28,63,.55);stroke-width:2.2;stroke-linecap:round;animation:xin .12s ease-out}
  .cell svg.cat{width:84%;height:84%;animation:pop .3s ease-out;filter:drop-shadow(0 2px 0 rgba(36,28,63,.35));position:relative}
  .cell.wrong{animation:shake .4s}
  .cell.wrong::after{content:"";position:absolute;inset:0;background:rgba(255,80,100,.6);animation:fade 1s forwards}
  .cell.hint{z-index:2}
  .cell.hint::after{content:"";position:absolute;inset:2px;border-radius:8px;box-shadow:0 0 0 3px #fff,0 0 14px 4px var(--butter);animation:glow 1.2s ease-in-out infinite alternate}
  .board.done .cell svg.cat{animation:dance .6s ease-in-out infinite alternate}
  @keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes xin{from{transform:scale(.4);opacity:0}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @keyframes fade{to{opacity:0}}
  @keyframes glow{from{opacity:.55}to{opacity:1}}
  @keyframes dance{from{transform:rotate(-8deg)}to{transform:rotate(8deg) translateY(-3px)}}
  .loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:var(--ink-dim)}
  .loading .dots{display:flex;gap:8px}
  .loading .dots i{width:12px;height:12px;border-radius:50%;background:var(--butter);animation:hop .9s ease-in-out infinite}
  .loading .dots i:nth-child(2){animation-delay:.15s;background:var(--mint)} .loading .dots i:nth-child(3){animation-delay:.3s;background:var(--lav)}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .msg{height:22px;text-align:center;font-size:14px;color:var(--butter);transition:opacity .2s}
  .gtools{display:flex;justify-content:center;gap:28px;padding-bottom:4px}
  .tool{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim)}
  .tool .knob{--c:var(--butter);--d:var(--butter-d);width:60px;height:60px;border-radius:22px;display:grid;place-items:center;
    background:var(--c);color:var(--btn-ink);position:relative;overflow:hidden;
    box-shadow:0 5px 0 var(--d),0 10px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .08s,box-shadow .08s}
  .tool .knob::before{content:"";position:absolute;left:6px;right:6px;top:3px;height:40%;border-radius:16px 16px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent)}
  .tool .knob .ic{width:28px;height:28px;position:relative}
  .tool:active .knob{transform:translateY(4px);box-shadow:0 1px 0 var(--d),0 4px 8px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.5)}
  .tool.lav .knob{--c:var(--lav);--d:var(--lav-d)} .tool.mint .knob{--c:var(--mint);--d:var(--mint-d)}

  /* ---------- 彈出面板 ---------- */
  .backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    background:rgba(10,8,24,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fadeIn .2s}
  .sheet{width:min(420px,100%);max-height:100%;overflow:auto;border-radius:28px;padding:22px 20px 20px;
    background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--glass-line);
    box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);animation:rise .32s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes fadeIn{from{opacity:0}} @keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
  .shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .shead h2{margin:0;font-size:24px;font-weight:400;letter-spacing:.08em}
  .srow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
  .srow:last-of-type{border-bottom:0}
  .srow .sic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--glass);color:var(--c,var(--ink));flex:none}
  .srow .sic .ic{width:21px;height:21px}
  .srow label{flex:1;font-size:17px;cursor:pointer}
  .srow small{display:block;color:var(--ink-dim);font-size:12px;margin-top:2px}
  .sw{appearance:none;-webkit-appearance:none;margin:0;width:54px;height:32px;border-radius:99px;background:#4a416f;position:relative;cursor:pointer;
    transition:background .2s;flex:none;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
  .sw::before{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
  .sw:checked{background:var(--mint)} .sw:checked::before{transform:translateX(22px)}
  .sbtns{display:grid;gap:12px;margin-top:16px}
  .sbtns.two{grid-template-columns:1fr 1fr}
  .sbtns .b3d{font-size:18px;padding:14px 16px}
  .rules p{display:flex;gap:12px;align-items:flex-start;margin:0;padding:10px 0;line-height:1.6;font-size:15px;border-bottom:1px solid rgba(255,255,255,.07)}
  .rules p:last-child{border-bottom:0}
  .rules .sic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--glass);flex:none;color:var(--c)}
  .rules .sic .ic{width:19px;height:19px}
  .rules b{color:var(--butter);font-weight:400}
  .sizegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sz{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:18px;
    background:linear-gradient(180deg,#43397a,#352c66);border:1px solid var(--glass-line);box-shadow:0 4px 0 #1a1533;transition:transform .08s,box-shadow .08s}
  .sz:active{transform:translateY(3px);box-shadow:0 1px 0 #1a1533}
  .sz .mini{width:40px;height:40px;border-radius:8px;border:2px solid var(--frame);
    background-color:var(--c);background-image:linear-gradient(rgba(36,28,63,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(36,28,63,.35) 1px,transparent 1px)}
  .sz .n{font-family:var(--num);font-size:20px;font-weight:600}
  .sz .best{font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .stat{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
  .stat span:last-child{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
  .bigstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .bigstats div{background:var(--glass);border-radius:16px;padding:12px;text-align:center}
  .bigstats b{display:block;font-family:var(--num);font-size:28px;font-weight:600;color:var(--butter)}
  .bigstats span{font-size:12px;color:var(--ink-dim)}
  .result{text-align:center}
  .result .badge{width:110px;height:110px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 40%,#5a4a9a,#2a2350 70%);box-shadow:0 0 50px rgba(255,215,110,.35)}
  .result .badge svg{width:80px;height:80px}
  .result h2{margin:4px 0 4px;font-size:30px;font-weight:400;letter-spacing:.1em}
  .result .sub{color:var(--ink-dim);font-size:14px;min-height:20px}
  .chips{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chips span{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-line);border-radius:99px;padding:6px 12px;font-family:var(--num);font-size:15px}
  .chips .ic{width:16px;height:16px;color:var(--butter)}
  .newbest{display:inline-block;margin-top:10px;background:var(--butter);color:var(--btn-ink);padding:4px 12px;border-radius:99px;font-size:14px}
  .paw{position:fixed;top:-40px;z-index:60;pointer-events:none;animation:fall linear forwards}
  .paw svg{width:100%;height:100%}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

  @media (min-width:700px){ .moon{width:90px;height:90px} }
  @media (max-height:640px){ .logo{width:84px;height:84px} .logo svg{width:60px;height:60px} .hero h1{font-size:36px} .tool .knob{width:52px;height:52px} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<div class="sky"></div>
<div class="moon"></div>

<!-- ===================== 首頁 ===================== -->
<main class="screen" id="home">
  <div class="hero">
    <div class="logo" id="logo"></div>
    <h1>喵喵領地</h1>
    <p>幫每一隻貓找到自己的地盤</p>
  </div>
  <button class="b3d" id="btnPlay"><span id="playIcon"></span><span id="playText">開始第 1 關</span><span class="chip" id="playChip">5×5</span></button>
  <button class="tile" id="btnDaily" style="--c:var(--mint)">
    <span class="bub" id="icDaily"></span>
    <span class="txt"><div class="t1">每日挑戰</div><div class="t2" id="dailySub">每天一題 8×8</div></span>
    <span class="done-badge" id="dailyDone" hidden>已完成</span>
    <span class="chev" data-ic="chev"></span>
  </button>
  <button class="tile" id="btnFree" style="--c:var(--lav)">
    <span class="bub" id="icFree"></span>
    <span class="txt"><div class="t1">自由練習</div><div class="t2">5×5 到 10×10，隨機出題</div></span>
    <span class="chev" data-ic="chev"></span>
  </button>
  <div class="homebar">
    <button class="hb" id="hbStats"><span class="ibtn" data-ic="trophy"></span>紀錄</button>
    <button class="hb" id="hbRules"><span class="ibtn" data-ic="help"></span>怎麼玩</button>
    <button class="hb" id="hbSettings"><span class="ibtn" data-ic="sliders"></span>設定</button>
  </div>
</main>

<!-- ===================== 遊戲畫面 ===================== -->
<main class="screen" id="game" hidden>
  <div class="gtop">
    <button class="ibtn" id="btnPause" aria-label="暫停" data-ic="pause"></button>
    <div class="gtitle"><div class="lv" id="title">第 1 關</div><div class="tm" id="timer">0:00</div></div>
    <div class="gright">
      <button class="ibtn" id="qMusic" aria-label="背景音樂"></button>
      <button class="ibtn" id="qSfx" aria-label="音效"></button>
    </div>
  </div>
  <div class="hearts" id="hearts"></div>
  <div class="boardArea" id="boardArea">
    <div class="board" id="board"></div>
    <div class="loading" id="loading" hidden><div class="dots"><i></i><i></i><i></i></div>貓咪正在劃地盤…</div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="gtools">
    <button class="tool" id="btnHint"><span class="knob" data-ic="bulb"></span>提示</button>
    <button class="tool lav" id="btnClear"><span class="knob" data-ic="eraser"></span>清除叉叉</button>
    <button class="tool mint" id="btnRestart"><span class="knob" data-ic="restart"></span>重來</button>
  </div>
</main>

<!-- ===================== 彈出面板 ===================== -->
<div class="backdrop" id="pauseSheet" hidden>
  <div class="sheet" role="dialog" aria-labelledby="pauseTitle">
    <div class="shead"><h2 id="pauseTitle">暫停</h2><button class="ibtn" id="pauseClose" aria-label="關閉" data-ic="close"></button></div>

/* ===================== 小工具 ===================== */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
const fmt=ms=>{const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};

/* ===================== 出題（保證唯一解） ===================== */
function genSolution(n,rnd){
  const cols=[],used=Array(n).fill(false);
  (function bt(r){
    if(r===n) return true;
    for(const c of shuffle([...Array(n).keys()],rnd)){
      if(used[c]||(r>0&&Math.abs(cols[r-1]-c)<=1)) continue;
      used[c]=true;cols[r]=c;
      if(bt(r+1)) return true;
      used[c]=false;
    }
    return false;
  })(0);
  return cols;
}
function nbrs4(i,n){const r=Math.floor(i/n),c=i%n,o=[];if(r>0)o.push(i-n);if(r<n-1)o.push(i+n);if(c>0)o.push(i-1);if(c<n-1)o.push(i+1);return o;}
function growRegions(n,sol,rnd){
  const reg=Array(n*n).fill(-1);
  sol.forEach((c,r)=>reg[r*n+c]=r);
  let left=n*n-n;
  while(left>0){
    const edges=[];
    for(let i=0;i<n*n;i++) if(reg[i]===-1) for(const j of nbrs4(i,n)) if(reg[j]!==-1) edges.push([i,reg[j]]);
    const [i,g]=edges[Math.floor(rnd()*edges.length)];
    reg[i]=g;left--;
  }
  return reg;
}
function findSolutions(n,reg,limit){
  const colU=Array(n).fill(false),regU=Array(n).fill(false),cols=[],out=[];
  (function bt(r){
    if(r===n){out.push(cols.slice());return out.length>=limit;}
    for(let c=0;c<n;c++){
      const g=reg[r*n+c];
      if(colU[c]||regU[g]||(r>0&&Math.abs(cols[r-1]-c)<=1)) continue;
      colU[c]=regU[g]=true;cols[r]=c;
      if(bt(r+1)) return true;
      colU[c]=regU[g]=false;
    }
    return false;
  })(0);
  return out;
}
function regionConnected(n,reg,g){
  const cells=[];for(let i=0;i<n*n;i++) if(reg[i]===g) cells.push(i);
  if(!cells.length) return false;
  const seen=new Set([cells[0]]),st=[cells[0]];
  while(st.length){const i=st.pop();for(const j of nbrs4(i,n)) if(reg[j]===g&&!seen.has(j)){seen.add(j);st.push(j);}}
  return seen.size===cells.length;
}
function makePuzzle(n,seed){
  const rnd=mulberry32(hashStr(seed));
  for(let attempt=0;attempt<200;attempt++){
    const sol=genSolution(n,rnd),reg=growRegions(n,sol,rnd);
    for(let it=0;it<400;it++){
      const sols=findSolutions(n,reg,2);
      if(sols.length===1) return {n,reg,sol};
      const other=sols.find(s=>s.some((c,r)=>c!==sol[r]));
      const cand=shuffle(other.map((c,r)=>r*n+c).filter((_,r)=>other[r]!==sol[r]),rnd);
      let moved=false;
      for(const cell of cand){
        const A=reg[cell];
        const Bs=shuffle([...new Set(nbrs4(cell,n).map(j=>reg[j]).filter(g=>g!==A))],rnd);
        for(const B of Bs){
          reg[cell]=B;
          if(regionConnected(n,reg,A)){moved=true;break;}
          reg[cell]=A;
        }
        if(moved) break;
      }
      if(!moved) break;
    }
  }
  throw new Error('出題失敗');
}

/* ===================== 防止手機點兩下放大 ===================== */
(function(){
  // 1. 遊戲畫面上，按鈕以外的地方一律不讓瀏覽器處理觸控手勢（不會放大、不會捲動）
  document.addEventListener('touchstart',e=>{
    const g=document.getElementById('game');
    if(g&&!g.hidden&&g.contains(e.target)&&!e.target.closest('button')&&e.cancelable) e.preventDefault();
  },{passive:false});
  // 2. 任何地方連點兩下：擋掉第二下，避免 iPhone 放大
  let lastEnd=0;
  document.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-lastEnd<=500 && e.cancelable) e.preventDefault();
    lastEnd=now;
  },{passive:false});
  // 3. 擋掉兩指縮放
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  // 4. 萬一還是被放大了：自動縮回原本大小
  const meta=document.querySelector('meta[name=viewport]');
  const base='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
  let fixing=false;
  function unzoom(){
    if(fixing||!window.visualViewport||visualViewport.scale<=1.01||!meta) return;
    fixing=true;
    meta.setAttribute('content',base.replace('initial-scale=1','initial-scale=1.0001'));
    setTimeout(()=>{ meta.setAttribute('content',base); window.scrollTo(0,0); fixing=false; },60);
  }
  if(window.visualViewport) visualViewport.addEventListener('resize',()=>setTimeout(unzoom,250));
})();

/* ===================== 音樂與音效（全部用程式即時合成） ===================== */
const Sound=(function(){
  let ctx=null, master, musicBus, sfxBus, musicTimer=null;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      ctx=new AC();
      const comp=ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
      master=ctx.createGain(); master.gain.value=0.9; master.connect(comp);
      musicBus=ctx.createGain(); musicBus.gain.value=0; musicBus.connect(master);
      sfxBus=ctx.createGain(); sfxBus.gain.value=0.8; sfxBus.connect(master);
    }
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone({f,type='sine',t=0,dur=.2,vol=.2,a=.005,slide=null,dest=null,lp=null}){
    if(!ctx) return; const s=ctx.currentTime+t;
    const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,s);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,s+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(vol,s+a);
    g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
    let node=o;
    if(lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);node=fl;}
    node.connect(g); g.connect(dest||sfxBus); o.start(s); o.stop(s+dur+.05);
  }
  function meow(){
    if(!ctx) return; const t=ctx.currentTime, k=0.9+Math.random()*0.3;
    const o=ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(480*k,t); o.frequency.linearRampToValueAtTime(820*k,t+.09); o.frequency.linearRampToValueAtTime(560*k,t+.34);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=5;
    bp.frequency.setValueAtTime(800,t); bp.frequency.linearRampToValueAtTime(1900,t+.1); bp.frequency.linearRampToValueAtTime(900,t+.34);
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.5,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+.38);
    o.connect(bp); bp.connect(g); g.connect(sfxBus); o.start(t); o.stop(t+.42);
  }
  const SFX={
    tap(){ tone({f:900,type:'triangle',dur:.06,vol:.12,slide:600}); },
    tick(){ tone({f:700,type:'triangle',dur:.04,vol:.06}); },
    cat(){ meow(); tone({f:1568,t:.02,dur:.15,vol:.05}); },
    wrong(){ tone({f:220,type:'square',dur:.28,vol:.09,slide:110,lp:900}); tone({f:233,type:'square',t:.02,dur:.26,vol:.06,slide:116,lp:900}); },
    hint(){ [1319,1568,2093].forEach((f,i)=>tone({f,t:i*.07,dur:.25,vol:.07})); },
    win(){ [72,76,79,84,79,84,88].forEach((m,i)=>tone({f:mtof(m),type:'triangle',t:i*.11,dur:.35,vol:.14})); setTimeout(meow,850); },
    lose(){ [67,63,60,55].forEach((m,i)=>tone({f:mtof(m),type:'triangle',t:i*.22,dur:.4,vol:.12})); },
    click(){ tone({f:1200,type:'sine',dur:.05,vol:.06}); },
    open(){ tone({f:660,type:'sine',dur:.09,vol:.07,slide:990}); },
    shut(){ tone({f:880,type:'sine',dur:.09,vol:.06,slide:560}); }
  };
  function play(name){ if(!save.sfx) return; if(!ensure()) return; SFX[name]&&SFX[name](); }
  /* ---------- 背景音樂：112 BPM 輕快編曲（鼓組＋彈跳貝斯＋和弦切分＋柔和鋪底＋主旋律＋鐘琴，含殘響與回音） ---------- */
  const BPM=112, STEP=60/BPM/4;             // 一格 = 16 分音符
  let fx=null, noise=null, step=0, nextStep=0;
  // 和弦（三和弦）與貝斯根音
  const CH={C:[60,64,67],G:[59,62,67],Am:[57,60,64],F:[57,60,65],Em:[59,64,67]};
  const ROOT={C:36,G:43,Am:45,F:41,Em:40};
  // A 段與 B 段，各 8 小節；旋律每小節 8 個八分音符（0=休止，-1=延長）
  const SONG=[
    {ch:['C','G','Am','F','C','G','F','G'], mel:[
      [76,0,79,0,84,-1,79,76],[74,0,79,0,83,-1,81,79],[72,0,76,0,81,-1,79,76],[77,-1,76,-1,74,-1,72,-1],
      [76,76,79,0,84,0,86,84],[83,-1,79,0,74,0,79,0],[81,-1,79,-1,77,-1,76,74],[74,-1,-1,-1,67,0,71,74]]},
    {ch:['F','G','Em','Am','F','G','C','C'], mel:[
      [81,0,81,84,0,81,79,77],[79,0,79,83,0,79,74,0],[76,0,79,83,-1,-1,81,79],[81,-1,-1,-1,76,0,81,0],
      [77,0,81,84,0,84,86,84],[86,-1,83,-1,79,-1,83,86],[84,-1,-1,-1,79,0,76,0],[72,0,76,79,84,-1,-1,0]]}
  ];
  const BARS=16;
  function setupFx(){
    if(fx) return fx;
    // 殘響：自己產生一段衰減雜訊當作空間感
    const len=ctx.sampleRate*1.8, ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
    const rev=ctx.createConvolver(); rev.buffer=ir;
    const revOut=ctx.createGain(); revOut.gain.value=.32; rev.connect(revOut); revOut.connect(musicBus);
    // 回音：附點八分音符
    const dl=ctx.createDelay(1); dl.delayTime.value=STEP*3;
    const fb=ctx.createGain(); fb.gain.value=.32;
    const dlf=ctx.createBiquadFilter(); dlf.type='lowpass'; dlf.frequency.value=2500;
    dl.connect(dlf); dlf.connect(fb); fb.connect(dl);
    const dlOut=ctx.createGain(); dlOut.gain.value=.22; dlf.connect(dlOut); dlOut.connect(musicBus);
    const drums=ctx.createGain(); drums.gain.value=.9; drums.connect(musicBus);
    const inst=ctx.createGain(); inst.gain.value=1; inst.connect(musicBus);
    noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const nd=noise.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    fx={rev,dl,drums,inst}; return fx;
  }
  function env(g,t,peak,a,d){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
  function out(node,{dry=fx.inst,rev=0,dly=0}={}){
    node.connect(dry);
    if(rev){const s=ctx.createGain();s.gain.value=rev;node.connect(s);s.connect(fx.rev);}
    if(dly){const s=ctx.createGain();s.gain.value=dly;node.connect(s);s.connect(fx.dl);}
  }
  function noiseSrc(t,dur){const n=ctx.createBufferSource();n.buffer=noise;n.start(t);n.stop(t+dur);return n;}
  // 鼓
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);
    env(g,t,.85,.002,.28);o.connect(g);out(g,{dry:fx.drums});o.start(t);o.stop(t+.35);}
  function snare(t,v=1){const n=noiseSrc(t,.2),bp=ctx.createBiquadFilter(),g=ctx.createGain();bp.type='bandpass';bp.frequency.value=1900;bp.Q.value=.7;
    env(g,t,.42*v,.002,.15);n.connect(bp);bp.connect(g);out(g,{dry:fx.drums,rev:.25});
    const o=ctx.createOscillator(),g2=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(160,t+.08);
    env(g2,t,.22*v,.002,.08);o.connect(g2);out(g2,{dry:fx.drums});o.start(t);o.stop(t+.12);}
  function hat(t,v=1,open=false){const n=noiseSrc(t,open?.3:.06),hp=ctx.createBiquadFilter(),g=ctx.createGain();hp.type='highpass';hp.frequency.value=7500;
    env(g,t,.11*v,.001,open?.22:.035);n.connect(hp);hp.connect(g);out(g,{dry:fx.drums});}
  // 貝斯：鋸齒波＋會「啵」一下的濾波器
  function bass(t,m,dur){const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=mtof(m);
    f.type='lowpass';f.Q.value=7;f.frequency.setValueAtTime(1500,t);f.frequency.exponentialRampToValueAtTime(260,t+.16);
    env(g,t,.2,.004,dur);o.connect(f);f.connect(g);out(g);o.start(t);o.stop(t+dur+.05);}
  // 和弦切分（像烏克麗麗刷弦）
  function stab(t,notes){notes.forEach((m,k)=>{const s=t+k*.008,o=ctx.createOscillator(),o2=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type='square';o2.type='triangle';o.frequency.value=mtof(m);o2.frequency.value=mtof(m+12);o2.detune.value=6;
    f.type='lowpass';f.frequency.setValueAtTime(3200,s);f.frequency.exponentialRampToValueAtTime(700,s+.12);
    env(g,s,.045,.003,.16);o.connect(f);o2.connect(f);f.connect(g);out(g,{rev:.3});o.start(s);o2.start(s);o.stop(s+.22);o2.stop(s+.22);});}
  // 柔和鋪底
  function pad(t,notes,dur){notes.forEach(m=>{[-8,8].forEach(dt=>{const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=dt;f.type='lowpass';f.frequency.value=900;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.012,t+.35);g.gain.setValueAtTime(.012,t+dur-.15);g.gain.linearRampToValueAtTime(0.0001,t+dur+.25);
    o.connect(f);f.connect(g);out(g,{rev:.6});o.start(t);o.stop(t+dur+.3);});});}
  // 主旋律：方波＋三角波，帶顫音、回音
  function lead(t,m,dur){const o=ctx.createOscillator(),o2=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type='square';o2.type='triangle';o.frequency.value=mtof(m);o2.frequency.value=mtof(m);o2.detune.value=-7;
    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(dur>.3?9:0,t+.25);
    lfo.connect(lg);lg.connect(o.detune);lg.connect(o2.detune);
    f.type='lowpass';f.frequency.setValueAtTime(4200,t);f.frequency.exponentialRampToValueAtTime(1900,t+.2);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.075,t+.01);g.gain.setValueAtTime(.06,t+Math.max(.02,dur-.04));g.gain.exponentialRampToValueAtTime(0.0001,t+dur+.12);
    o.connect(f);o2.connect(f);f.connect(g);out(g,{rev:.35,dly:.6});
    [o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+.2);});}
  // 鐘琴（高八度，亮亮的）
  function glock(t,m){[[1,.05],[3.98,.012]].forEach(([r,v])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=mtof(m+12)*r;
    env(g,t,v,.002,r>1?.15:.6);o.connect(g);out(g,{rev:.5});o.start(t);o.stop(t+.7);});}

  function scheduleStep(t){
    const s=step%(BARS*16), bar=Math.floor(s/16), p=s%16, sec=SONG[Math.floor(bar/8)], b8=bar%8;
    const cName=sec.ch[b8], chord=CH[cName], root=ROOT[cName];
    const loop=Math.floor(step/(BARS*16)), intro=(loop===0&&bar<2);
    // 鼓組
    if(!intro){
      if(p===0||p===8||(p===14&&b8%2===1)) kick(t);
      if(p===4||p===12) snare(t);
      if(b8===7&&p>=12) snare(t,.35+.15*(p-12));      // 段落結尾的小過門
    }
    if(p%2===0) hat(t,p%4===2?1:.55,p===14&&b8%4===3); else if(!intro) hat(t,.3);
    // 貝斯：彈跳的八度
    const bp=[0,null,12,0,null,0,7,12,0,null,12,0,null,0,7,12];
    if(!intro&&bp[p]!==null) bass(t,root+bp[p],STEP*1.6);
    // 和弦切分：反拍
    if(p%4===2) stab(t,chord);
    // 鋪底：每小節一次
    if(p===0) pad(t,chord.map(m=>m-12),STEP*16);
    // 主旋律（第一輪前兩小節當前奏不唱）
    if(p%2===0&&!intro){
      const row=sec.mel[b8], e=p/2, m=row[e];
      if(m>0){
        let len=1; for(let k=e+1;k<8&&row[k]===-1;k++) len++;
        lead(t,m,len*STEP*2*.92);
        if(loop%2===1||Math.floor(bar/8)===1) glock(t,m);   // 第二輪與 B 段加上鐘琴
      }
    }
    step++;
  }
  function startMusic(){
    if(!ensure()||musicTimer) return;
    setupFx();
    nextStep=Math.max(nextStep,ctx.currentTime+.1);
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setTargetAtTime(.6,ctx.currentTime,.4);
    musicTimer=setInterval(()=>{ while(nextStep<ctx.currentTime+.4){ scheduleStep(nextStep); nextStep+=STEP; } },60);
  }
  function stopMusic(){
    if(!ctx||!musicTimer) return;
    clearInterval(musicTimer); musicTimer=null;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setTargetAtTime(0,ctx.currentTime,.3);
  }
  function unlock(){ if(save.music) startMusic(); else ensure(); }
  document.addEventListener('pointerdown',unlock,true);
  document.addEventListener('visibilitychange',()=>{ if(!ctx) return; if(document.hidden) ctx.suspend().catch(()=>{}); else ctx.resume().catch(()=>{}); });
  return {play,startMusic,stopMusic,state:()=>ctx?ctx.state+(musicTimer?' / 音樂播放中':''):'未啟動'};
})();

const SAVE_KEY='cat-territory-v1';
let save={level:1,best:{},daily:{},auto:true,wins:0,music:true,sfx:true};
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY))||{});}catch(e){}

/* ===================== 畫面切換與面板 ===================== */
const $=id=>document.getElementById(id);
document.querySelectorAll('[data-ic]').forEach(el=>el.innerHTML=ic(el.dataset.ic));
$('logo').innerHTML=catSVG('#f4a259','');
$('icDaily').innerHTML=ic('calendar'); $('icFree').innerHTML=ic('grid'); $('playIcon').innerHTML=ic('play');
$('winCat').innerHTML=catSVG('#f4a259',''); $('loseCat').innerHTML=catSVG('#6b6680','');

function showScreen(name){ $('home').hidden=name!=='home'; $('game').hidden=name!=='game'; $('roofs').style.display=name==='home'?'':'none'; document.querySelector('.moon').style.display=name==='home'?'':'none'; }
function openSheet(id){ document.querySelectorAll('.backdrop').forEach(b=>b.hidden=true); $(id).hidden=false; Sound.play('open'); }
function closeSheet(id){ $(id).hidden=true; }
const anySheetOpen=()=>[...document.querySelectorAll('.backdrop')].some(b=>!b.hidden);

/* ===================== 遊戲狀態 ===================== */
const boardEl=$('board');
let P=null, mode=null, marks=[], cats=new Set(), hearts=3, mistakes=0, hintsUsed=0;
let startT=0, elapsed=0, timerId=null, finished=false, paused=false, pauseAt=0, lastTap=null, drag=null, msgT=null;

function levelSize(k){return k<=5?5:k<=15?6:k<=35?7:k<=60?8:k<=100?9:10;}

function startGame(m){
  mode=m;
  let n,seed,title;
  if(m.type==='level'){n=levelSize(m.level);seed='level-'+m.level;title=`第 ${m.level} 關 · ${n}×${n}`;}
  else if(m.type==='daily'){n=8;seed='daily-'+m.date;title=`每日挑戰 · ${+m.date.slice(5,7)}/${+m.date.slice(8)}`;}
  else {n=m.size;seed='free-'+Math.random();title=`自由練習 · ${n}×${n}`;}
  m.n=n; $('title').textContent=title;
  document.querySelectorAll('.backdrop').forEach(b=>b.hidden=true);
  showScreen('game');
  $('loading').hidden=false; boardEl.style.visibility='hidden'; boardEl.innerHTML='';
  clearInterval(timerId); $('timer').textContent='0:00'; finished=true;
  setTimeout(()=>{
    P=makePuzzle(n,seed);
    resetBoard();
    $('loading').hidden=true; boardEl.style.visibility='';
  },40);
}
function resetBoard(){
  const n=P.n;
  marks=Array(n*n).fill(0); cats=new Set(); hearts=3; mistakes=0; hintsUsed=0; finished=false; paused=false;
  document.querySelectorAll('.backdrop').forEach(b=>b.hidden=true);
  boardEl.classList.remove('done');
  buildBoard(); renderHearts(); setMsg('');
  startT=performance.now(); elapsed=0;
  clearInterval(timerId); timerId=setInterval(tick,250); tick();
}
function tick(){ if(!finished&&!paused) elapsed=performance.now()-startT; $('timer').textContent=fmt(elapsed); }
function pauseGame(){
  if(!P||finished||$('game').hidden) return;
  if(!paused){ paused=true; pauseAt=performance.now(); }
  $('pauseGameBtns').hidden=false; $('pauseTitle').textContent='暫停';
  openSheet('pauseSheet');
}
function resumeGame(){
  closeSheet('pauseSheet');
  if(paused){ startT+=performance.now()-pauseAt; paused=false; }
  Sound.play('shut');
}

function buildBoard(){
  const n=P.n, area=$('boardArea');
  const avail=Math.min(area.clientWidth,area.clientHeight)-10;
  const cs=Math.max(26,Math.min(72,Math.floor(avail/n)));
  boardEl.style.gridTemplateColumns=`repeat(${n},${cs}px)`;
  boardEl.innerHTML='';
  const thin='rgba(36,28,63,.2)', thick='#241c3f';
  for(let i=0;i<n*n;i++){
    const r=Math.floor(i/n),c=i%n,g=P.reg[i];
    const d=document.createElement('div');
    d.className='cell'; d.dataset.i=i;
    d.style.width=d.style.height=cs+'px';
    d.style.background=REGION_COLORS[g];
    const side=(cond,diff)=>cond?['0',thick]:(diff?['1.5px',thick]:['.5px',thin]);
    const T=side(r===0,r>0&&P.reg[i-n]!==g), B=side(r===n-1,r<n-1&&P.reg[i+n]!==g);
    const L=side(c===0,c>0&&P.reg[i-1]!==g), R=side(c===n-1,c<n-1&&P.reg[i+1]!==g);
    d.style.borderWidth=`${T[0]} ${R[0]} ${B[0]} ${L[0]}`;
    d.style.borderColor=`${T[1]} ${R[1]} ${B[1]} ${L[1]}`;
    boardEl.appendChild(d);
  }
  for(let i=0;i<n*n;i++) drawCell(i);
}
function cellEl(i){return boardEl.children[i];}
function drawCell(i){
  const el=cellEl(i);
  if(cats.has(i)){ if(!el.querySelector('svg.cat')) el.innerHTML=catSVG(CAT_COLORS[P.reg[i]%CAT_COLORS.length]); }
  else el.innerHTML = marks[i]===1?XM:'';
}
function renderHearts(breakIdx=-1){
  $('hearts').innerHTML=[0,1,2].map(k=>HEART.replace('<svg',`<svg class="${k<hearts?'':'lost'}${k===breakIdx?' break':''}"`)).join('');
}
function setMsg(t){ $('msg').textContent=t; clearTimeout(msgT); if(t) msgT=setTimeout(()=>$('msg').textContent='',2600); }

/* ===================== 操作 ===================== */
function toggleX(i){ if(finished||cats.has(i)) return; Sound.play('tap'); marks[i]=marks[i]===1?0:1; drawCell(i); }
function setX(i,val){ if(cats.has(i)) return; if(marks[i]!==val){marks[i]=val;drawCell(i);} }
function autoMark(i){
  const n=P.n,r=Math.floor(i/n),c=i%n,g=P.reg[i];
  for(let j=0;j<n*n;j++){
    if(j===i||cats.has(j)) continue;
    const rj=Math.floor(j/n),cj=j%n;
    if(rj===r||cj===c||P.reg[j]===g||(Math.abs(rj-r)<=1&&Math.abs(cj-c)<=1)) setX(j,1);
  }
}
function placeCat(i){
  if(finished||paused||cats.has(i)) return;
  const n=P.n,r=Math.floor(i/n),c=i%n;
  const el=cellEl(i); el.classList.remove('hint');
  if(P.sol[r]===c){
    cats.add(i); marks[i]=0; drawCell(i);
    if(save.auto) autoMark(i);
    if(cats.size===n) win(); else Sound.play('cat');
  }else{
    hearts--; mistakes++; renderHearts(hearts);
    if(hearts>0) Sound.play('wrong');
    marks[i]=1; drawCell(i);
    el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
    setMsg('這裡不能放貓！');
    if(hearts<=0) lose();
  }
}
function hint(){
  if(finished||paused) return;
  const n=P.n;
  boardEl.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));
  for(let r=0;r<n;r++){const i=r*n+P.sol[r]; if(marks[i]===1&&!cats.has(i)){marks[i]=0;drawCell(i);cellEl(i).classList.add('hint');Sound.play('hint');setMsg('發光的這格叉叉打錯了，已幫你擦掉');hintsUsed++;return;}}
  let best=null,bestCnt=1e9;
  for(let r=0;r<n;r++){
    const i=r*n+P.sol[r]; if(cats.has(i)) continue;
    const g=P.reg[i]; let cnt=0;
    for(let j=0;j<n*n;j++) if(P.reg[j]===g&&marks[j]===0&&!cats.has(j)) cnt++;
    if(cnt<bestCnt){bestCnt=cnt;best=i;}
  }
  if(best!==null){hintsUsed++; Sound.play('hint'); placeCat(best); if(!finished) cellEl(best).classList.add('hint'); setMsg('幫你放了一隻貓');}
}
function clearX(){ if(finished||paused) return; Sound.play('click'); for(let i=0;i<marks.length;i++) if(marks[i]===1){marks[i]=0;drawCell(i);} }

function pawRain(){
  const colors=['#ffd76e','#ffa47e','#86dfc6','#bba8ff','#ffb1bb'];
  for(let k=0;k<22;k++){
    const p=document.createElement('div'); p.className='paw'; p.innerHTML=PAW;
    const s=16+Math.random()*22; p.style.width=p.style.height=s+'px';
    p.style.left=Math.random()*100+'vw'; p.style.color=colors[k%colors.length];
    p.style.animationDuration=(2.2+Math.random()*2)+'s'; p.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(p); setTimeout(()=>p.remove(),5200);
  }
}
function win(){
  finished=true; elapsed=performance.now()-startT; tick();
  boardEl.classList.add('done'); Sound.play('win'); pawRain();
  const key=mode.type==='daily'?'daily':`size${P.n}`;
  const prev=save.best[key];
  const isBest=prev==null||elapsed<prev;
  if(isBest) save.best[key]=elapsed;
  save.wins=(save.wins||0)+1;
  if(mode.type==='level'&&mode.level===save.level) save.level++;
  if(mode.type==='daily'&&(save.daily[mode.date]==null||elapsed<save.daily[mode.date])) save.daily[mode.date]=elapsed;
  persist(); refreshHome();
  setTimeout(()=>{
    $('winSub').textContent=mode.type==='level'?`第 ${mode.level} 關完成`:mode.type==='daily'?'今天的每日挑戰完成了':`${P.n}×${P.n} 完成`;
    $('winChips').innerHTML=`<span>${ic('clock')}${fmt(elapsed)}</span><span>${ic('heart')}錯 ${mistakes}</span><span>${ic('bulb')}提示 ${hintsUsed}</span>`;
    $('winBest').innerHTML=isBest?'<span class="newbest">新紀錄！</span>':`<div class="sub" style="margin-top:10px">最佳紀錄 ${fmt(prev)}</div>`;
    $('btnNext').innerHTML=ic('play')+(mode.type==='level'?`下一關（第 ${save.level} 關）`:mode.type==='daily'?'去關卡模式':'再來一題');
    openSheet('winSheet');
  },1000);
}
function lose(){ finished=true; Sound.play('lose'); setTimeout(()=>openSheet('loseSheet'),600); }

/* ===================== 觸控／滑鼠 ===================== */
function idxAt(x,y){const el=document.elementFromPoint(x,y);const c=el&&el.closest('.cell');return c&&boardEl.contains(c)?+c.dataset.i:null;}
boardEl.addEventListener('contextmenu',e=>e.preventDefault());
boardEl.addEventListener('pointerdown',e=>{
  if(finished||paused) return;
  const i=idxAt(e.clientX,e.clientY); if(i==null) return;
  e.preventDefault();
  if(e.button===2){ placeCat(i); return; }
  if(e.button!==0) return;
  drag={start:i,moved:false,val:marks[i]===1?0:1,seen:new Set([i]),timer:null};
  if(e.pointerType!=='mouse'){
    const d=drag;
    d.timer=setTimeout(()=>{ if(drag===d&&!d.moved){ drag=null; lastTap=null; if(navigator.vibrate) try{navigator.vibrate(20);}catch(_){} placeCat(d.start);} },450);
  }
  boardEl.setPointerCapture(e.pointerId);
});
boardEl.addEventListener('pointercancel',()=>{ if(drag) clearTimeout(drag.timer); drag=null; });
boardEl.addEventListener('pointermove',e=>{
  if(!drag) return;
  const i=idxAt(e.clientX,e.clientY); if(i==null||drag.seen.has(i)) return;
  clearTimeout(drag.timer);
  if(!drag.moved){drag.moved=true; setX(drag.start,drag.val);}
  drag.seen.add(i); setX(i,drag.val); Sound.play('tick');
});
boardEl.addEventListener('pointerup',()=>{
  if(!drag) return;
  const d=drag; drag=null; clearTimeout(d.timer);
  if(d.moved){lastTap=null;return;}
  const now=performance.now();
  if(lastTap&&lastTap.i===d.start&&now-lastTap.t<350){ lastTap=null; placeCat(d.start); }
  else { lastTap={i:d.start,t:now}; toggleX(d.start); }
});

/* ===================== 首頁與設定 ===================== */
function refreshHome(){
  const n=levelSize(save.level);
  $('playText').textContent=`開始第 ${save.level} 關`; $('playChip').textContent=`${n}×${n}`;
  const d=todayStr(), done=save.daily[d]!=null;
  $('dailySub').textContent=`${+d.slice(5,7)}/${+d.slice(8)} · 8×8`+(done?` · ${fmt(save.daily[d])}`:'');
  $('dailyDone').hidden=!done;
}
function refreshToggles(){
  $('swAuto').checked=save.auto; $('swMusic').checked=save.music; $('swSfx').checked=save.sfx;
  $('qMusic').innerHTML=ic('music',save.music?'':ICON.slash); $('qMusic').classList.toggle('off',!save.music);
  $('qSfx').innerHTML=ic(save.sfx?'sound':'soundoff'); $('qSfx').classList.toggle('off',!save.sfx);
}
function setMusic(on){ save.music=on; persist(); refreshToggles(); on?Sound.startMusic():Sound.stopMusic(); }
function setSfx(on){ save.sfx=on; persist(); refreshToggles(); Sound.play('click'); }
function renderSizes(){
  $('sizegrid').innerHTML=[5,6,7,8,9,10].map((n,k)=>{
    const b=save.best['size'+n], cell=36/n;
    return `<button class="sz" data-n="${n}"><span class="mini" style="--c:${REGION_COLORS[k*2%10]};background-size:${cell}px ${cell}px"></span><span class="n">${n}×${n}</span><span class="best">${b!=null?'最快 '+fmt(b):'還沒玩過'}</span></button>`;
  }).join('');
  $('sizegrid').querySelectorAll('.sz').forEach(b=>b.onclick=()=>startGame({type:'free',size:+b.dataset.n}));
}
function renderStats(){
  let h=`<div class="bigstats"><div><b>${save.wins||0}</b><span>完成題數</span></div><div><b>${Object.keys(save.daily).length}</b><span>每日挑戰天數</span></div></div>`;
  h+=`<div class="stat"><span>目前關卡</span><span>第 ${save.level} 關</span></div>`;
  for(let n=5;n<=10;n++){const b=save.best['size'+n];h+=`<div class="stat"><span>${n}×${n} 最快</span><span>${b!=null?fmt(b):'—'}</span></div>`;}
  const db=save.best.daily; h+=`<div class="stat"><span>每日挑戰最快</span><span>${db!=null?fmt(db):'—'}</span></div>`;
  $('statsBody').innerHTML=h;
}

$('btnPlay').onclick=()=>startGame({type:'level',level:save.level});
$('btnDaily').onclick=()=>startGame({type:'daily',date:todayStr()});
$('btnFree').onclick=()=>{renderSizes();openSheet('sizeSheet');};
$('hbStats').onclick=()=>{renderStats();openSheet('statsSheet');};
$('hbRules').onclick=()=>openSheet('rulesSheet');
$('hbSettings').onclick=()=>{$('pauseGameBtns').hidden=true;$('pauseTitle').textContent='設定';openSheet('pauseSheet');};

$('btnPause').onclick=pauseGame;
$('btnResume').onclick=resumeGame;
$('pauseClose').onclick=()=>{ if(!$('game').hidden) resumeGame(); else {closeSheet('pauseSheet');Sound.play('shut');} };
$('pRestart').onclick=()=>{ if(P) resetBoard(); };
$('pRules').onclick=()=>{ $('rulesSheet').dataset.back='pause'; openSheet('rulesSheet'); };
$('pHome').onclick=()=>{ clearInterval(timerId); finished=true; paused=false; closeSheet('pauseSheet'); refreshHome(); showScreen('home'); };
function closeRules(){ closeSheet('rulesSheet'); if($('rulesSheet').dataset.back==='pause'){ $('rulesSheet').dataset.back=''; openSheet('pauseSheet'); } else Sound.play('shut'); }
$('rulesClose').onclick=closeRules; $('rulesOk').onclick=closeRules;
$('sizeClose').onclick=()=>{closeSheet('sizeSheet');Sound.play('shut');};
$('statsClose').onclick=()=>{closeSheet('statsSheet');Sound.play('shut');};

$('swAuto').onchange=e=>{save.auto=e.target.checked;persist();Sound.play('click');};
$('swMusic').onchange=e=>setMusic(e.target.checked);
$('swSfx').onchange=e=>setSfx(e.target.checked);
$('qMusic').onclick=()=>setMusic(!save.music);
$('qSfx').onclick=()=>setSfx(!save.sfx);

$('btnHint').onclick=hint;
$('btnClear').onclick=clearX;
$('btnRestart').onclick=()=>{ if(P&&!paused){ Sound.play('click'); resetBoard(); } };
$('btnRetry').onclick=resetBoard;
$('btnReplay').onclick=()=>{ if(mode.type==='free') startGame({type:'free',size:mode.size}); else resetBoard(); };
$('btnNext').onclick=()=>{
  if(mode.type==='free') startGame({type:'free',size:mode.size});
  else startGame({type:'level',level:save.level});
};
const goHome=()=>{ clearInterval(timerId); document.querySelectorAll('.backdrop').forEach(b=>b.hidden=true); refreshHome(); showScreen('home'); };
$('wHome').onclick=goHome; $('lHome').onclick=goHome;

// 點面板外面：暫停面板＝繼續；說明／尺寸／紀錄＝關閉
document.querySelectorAll('.backdrop').forEach(b=>b.addEventListener('click',e=>{
  if(e.target!==b) return;
  if(b.id==='pauseSheet') $('pauseClose').onclick();
  else if(b.id==='rulesSheet') closeRules();
  else if(b.id==='sizeSheet'||b.id==='statsSheet'){ closeSheet(b.id); Sound.play('shut'); }
}));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('pauseSheet').hidden) $('pauseClose').onclick(); else if(!$('game').hidden&&!anySheetOpen()) pauseGame(); } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&!$('game').hidden&&!finished&&!paused) pauseGame(); });

let resizeT=null, lastSize='';
addEventListener('resize',()=>{ clearTimeout(resizeT); resizeT=setTimeout(()=>{
  const sz=innerWidth+'x'+innerHeight; if(sz===lastSize) return; lastSize=sz;
  if(P&&!$('game').hidden){ buildBoard(); if(boardEl.classList.contains('done')){} }
},150); });

refreshHome(); refreshToggles(); showScreen('home');
</script>
